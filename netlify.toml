# Netlify Konfiguration - PhysioPro Anfrage-Management

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Testumgebung (develop-Branch)
[context.develop]
  command = "npm run build"
  publish = "dist"

# SPA Fallback: alle Routen auf index.html (ausser API-Funktionen)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
